# Orqen Workflow — Dynamic MCP Tools Demo
#
# Demonstrates dynamic MCP tools.
#
# Lanes:
#   inbox      — Lê o arquivo, roda code_stats em cada projeto, gera relatório
#   report     — Relatórios gerados aguardam revisão

agents:
  default: "qwen"
  clients:
    qwen:
      command: ["qwen", "--yolo", "--acp"]
    claude:
      command: ["npx", "-y", "@agentclientprotocol/claude-agent-acp"]

tools:
  code_stats:
    command: ["bash", ".orqen/task/scripts/code_stats.sh", "$dir"]
    windows: ["cmd", "/c", ".orqen\\task\\scripts\\code_stats.bat", "$dir"]
    timeout: 30
    description: "Conta linhas de código por extensão em um diretório"
    args:
      dir: "Diretório raiz para analisar (ex: ., ../meu-projeto)"

modules:
  - name: task
    dir: "./tasks"
    lanes:

      # ── Processamento ───────────────────────────────────────────────
      - name: "inbox"
        purpose: "Lê projetos, roda code_stats em cada um, gera relatório"
        agent_behavior:
          - "Leia o arquivo do item para obter a lista de projetos"
          - "Use o tool workitem_create (orqen MCP Server) para criar um novo item na lane report"          
          - "Para cada projeto na lista, invoque o tool code_stats (orqen MCP Server) para gerar o relatório do projeto"
          - "Consolide os resultados de todos os projetos em um único relatório, no diretório do item criado em report"                    
          - "Mova o arquivo do inbox para o diretório do item criado na lane report"
          - "Finalize a execução"
        critical_rules:
          - "Nunca execute alterações — apenas leitura e diagnóstico"
          - "Se code_stats falhar para um projeto, registre o erro no relatório mas continue com os demais"
          - "Se a lista de projetos estiver vazia, remova o arquivo e finalize a execução"
        extra_prompt: |
          Produza um relatório consolidado com a soma de linhas por extensão.

      # ── Relatório ───────────────────────────────────────────────────
      - name: "report"
        purpose: "Relatórios prontos para revisão humana"
        user_action: "revisar e arquivar"
