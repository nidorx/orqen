<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8" />
   <title>Orqen - Execution layer for AI workflows</title>
   <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
   <meta name="description" content="Camada de execução para workflows de IA - orquestração determinística com agentes ACP" />
   <meta name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
   <link rel="icon" type="image/svg+xml" href="./ico.svg" />
   <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4.12.1/themes/vue.css">
   <link rel="stylesheet" href="./style.css" />
</head>

<body>
   <div id="app"></div>
   <script>
      window.$docsify = {
         repo: 'nidorx/orqen',
         name: 'Orqen',
         loadSidebar: true,
         auto2top: true,
         coverpage: true,
         executeScript: true,
         loadNavbar: true,
         relativePath: true,
         themeColor: '#6C5CE7',
         fallbackLanguages: ['pt-br'],
         search: false,
         copyCode: {
            buttonText: 'Clique para copiar',
            errorText: 'Erro',
            successText: 'Copiado'
         }
      }

      // remove sidebar's title and add Orqen logo
      let interval = setInterval(function () {
         if (document.getElementsByTagName('aside')[0]) {
            let parent = document.getElementsByTagName('aside')[0]
            parent.removeChild(parent.getElementsByTagName('h1')[0])
            let div = document.createElement('div')
            div.setAttribute('class', 'logo')
            let a = document.createElement('a')
            a.setAttribute('href', '#/')
            let img = document.createElement('img')
            img.setAttribute('src', './logo.svg')
            img.setAttribute('alt', 'Orqen')

            a.appendChild(img)
            div.appendChild(a)
            parent.prepend(div)
            clearInterval(interval)
         }
      }, 0)
   </script>
   <script src="//cdn.jsdelivr.net/npm/docsify@4.12.1"></script>
   <script src="//cdn.jsdelivr.net/npm/docsify@4.12.1/lib/plugins/zoom-image.min.js"></script>
   <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
   <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
   <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
   <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
   <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>

</html>
