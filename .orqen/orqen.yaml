# Orqen Project Configuration

agents:
  default: "qwen"
  clients:
    qwen:
      command: ["qwen", "--yolo", "--acp"]

execution:
  max_agents: 10
  sleep_interval_seconds: 30

# chat:
#   telegram:
#     secret: "123"
#     token: "***"

modules:
  - name: task
    dir: "tasks"
    order: ["push", "review", "inbox", "prioritized", "ready"]
    extra_prompt: |
      > Quick links: 
      - [Architecture](docs/ARCHITECTURE.md)
      - [Abstractions](docs/ABSTRACTIONS.md) 
      - [Config File](docs/CONFIG.md)
      - [Getting Started](docs/GETTING-STARTED.md)

      **CONTEXT**: Assisted development workflow. The agent receives issues/tasks, 
      analyses, specifies the solution, implements and opens PR - but with human checkpoints 
      before coding and before opening the PR. 

      **PRINCIPLE**: The agent does the heavy lifting (analysis, implementation, testing), 
      but the human makes the architectural decisions and approves the final result. 

      **QUALITY**: All code must follow project conventions, have tests and 
      pass linting before being moved for review.

      **TEMPLATES**: For each generated artifact, USE THE CORRESPONDING TEMPLATE in the directory 
      `.orqen/task/prompts/` as a structural base. Fill in all sections of the template.

      The templates are:
      - TASK.md → Task/Issue information
      - SUMMARY.md → Task after implementation summary
      - REFINEMENT.md → Task details
      - FAIL.md → Task fail reasons
    lanes:         

      # ── 01_vision ──────────────────────────────────────────────
      - name: "vision"
        purpose: "User ideation and task conception - agent does NOT execute tasks from this lane"
        user_action: "create ideas"              

      # ── 02_inbox ───────────────────────────────────────────────
      - name: "inbox"
        purpose: "User ideas that are ready to be transformed into tasks by the agent"
        artifacts: ["TASK"]
        agent_behavior:
          - Read the provided inbox file description and all comments fully to understand the idea
          - Check `docs/adr/` for relevant architecture decisions before structural choices
          - Analyze and decompose into one or more executable tasks - each task should deliver a single piece of value and be independently testable          
          - Identify whether the proposed changes require updates to the documentation located at `site`
          - >
            If documentation updates are required, create an additional documentation task in the backlog using the TASK template.
            The documentation task must explicitly describe what documentation needs to be updated, created, or reviewed.         
          - Create each task in the backlog lane using the TASK template using the orqen_create_item tool (Orqen MCP Server)
          - > 
            Move the inbox file to the directory of the first task created from that idea - do not remove the file, just move it. 
            Then, copy the same file to the directory of all other tasks created from this idea          
        critical_rules:
          - Create ALL tasks in the backlog in this single invocation using the orqen_create_item tool (Orqen MCP Server)
          - Never ignore documentation impact analysis when decomposing tasks

      # ── 03_backlog ─────────────────────────────────────────────
      - name: "backlog"
        purpose: "All newly created tasks awaiting prioritization"
        user_action: "prioritize"

      # ── 04_prioritized ─────────────────────────────────────────
      - name: "prioritized"
        purpose: "Tasks explicitly selected by the user for deep technical refinement, architectural validation, and implementation planning before execution"
        ignore_if_dependency: ["inbox", "backlog", "prioritized"]
        artifacts: ["REFINEMENT"]
        max_agents: 1
        agent_behavior:
          - "Read WI-${SEQUENCE}-TASK.md completely to understand the business goal, technical context, constraints, dependencies, and expected outcome"
          - "Read relevant architecture documents, quick links, existing ADRs, and surrounding implementation context before refining"
          - "Inspect the current codebase related to the task: modules, interfaces, contracts, patterns, tests, integrations, and conventions"
          - "Identify what already exists versus what must be introduced or changed"
          - "Clarify ambiguities, missing technical details, implicit assumptions, edge cases, and operational concerns"
          - "Define a concrete implementation strategy detailed enough for another engineer or agent to implement without additional discovery"
          - "Identify impacted layers, services, APIs, persistence models, events, workflows, infra, and external integrations"
          - "Map affected files, modules, domains, and ownership boundaries"
          - "Validate alignment with existing architecture and accepted ADRs"
          - "Identify risks, trade-offs, migration concerns, backward compatibility implications, and performance considerations"
          - "Define clear, testable, and implementation-oriented acceptance criteria"
          - "Define a practical and verifiable Definition of Done (DoD)"
          - "Draft new ADRs when architectural decisions are discovered that are not covered by existing accepted ADRs"
          - "Create the REFINEMENT artifact using the REFINEMENT.md template"
          - "Ensure the refinement artifact can be directly consumed by implementation agents with minimal ambiguity"
          - "Use the tool orqen_move_item (orqen MCP Server) to move the item from the prioritized lane to refined" 
          - "Finalize execution"
        critical_rules:
          - "DO NOT implement production code in this lane"
          - "The refinement MUST reduce implementation ambiguity as much as possible"
          - "Prefer explicit decisions over open interpretation"
          - "Document assumptions whenever the codebase or task description is incomplete"
          - "Separate mandatory constraints from optional recommendations"
          - "Distinguish clearly between existing behavior and proposed behavior"
          - "When multiple implementation approaches exist, explain trade-offs and recommend one"
          - "Never ignore accepted ADRs - they are binding architectural constraints"
          - "If an accepted ADR conflicts with the task, surface the conflict explicitly instead of bypassing it"
          - "New ADRs must only be created for reusable architectural decisions, not local implementation details"
        extra_prompt: |
          This lane is responsible for TECHNICAL REFINEMENT and IMPLEMENTATION PREPARATION.

          The goal is not merely to summarize the task, but to transform the task into a
          technically actionable implementation plan with sufficient architectural clarity,
          implementation direction, and delivery constraints.

          The agent must operate as a senior engineer performing architectural and technical
          refinement before implementation begins.

          The agent already has access to:
          - WI-${SEQUENCE}-TASK.md
          - Architecture documents
          - Quick links
          - Existing ADRs
          - The current codebase

          The refinement should answer:
          - What exactly needs to change?
          - Why does it need to change?
          - Where will the changes happen?
          - How should the implementation be approached?
          - Which architectural constraints must be respected?
          - What risks exist?
          - What remains uncertain?
          - What decisions must be validated by the user?
          - What can an implementation agent execute directly afterward?

          During refinement:
          - Investigate surrounding code and existing patterns before proposing new abstractions
          - Prefer consistency with current architecture unless there is a strong reason not to
          - Identify coupling, side effects, and hidden dependencies
          - Consider operational impact: migrations, rollout strategy, observability, backward compatibility, failure handling, concurrency, retries, idempotency, security, and performance
          - Analyze testing impact: unit, integration, e2e, regression, fixtures, mocks, and test data requirements
          - Identify whether the task affects public contracts, APIs, schemas, protocols, storage, events, or external consumers
          - Explicitly document assumptions and unresolved ambiguities
          - Recommend implementation sequencing when relevant

          ADR PROCESS:

          Before refining:
          - Inspect `docs/adr/`
          - Read all accepted ADRs relevant to the task domain
          - Treat accepted ADRs as mandatory architectural constraints
          - Document consulted ADRs in the "ADR Consultation" section of the refinement

          If refinement reveals an architectural decision that:
          - is reusable,
          - affects future development,
          - changes architectural direction,
          - introduces a new dependency/platform/pattern,
          - modifies cross-cutting behavior,
          - or establishes a binding technical convention,

          and this decision is NOT already covered by an accepted ADR:

          Then:
          - Draft a new ADR using `docs/adr/prompts/ADR.md`
          - Place it in the ADR draft lane
          - Reference it in the "New ADR Proposals" section

          DO NOT create ADRs for:
          - Small refactors
          - Bug fixes
          - Styling decisions
          - Local implementation details
          - Naming choices
          - Temporary workarounds

          The final REFINEMENT artifact must be implementation-oriented, technically explicit,
          architecturally aligned, and operationally aware.

      # ── 05_refined ─────────────────────────────────────────────
      - name: "refined"
        purpose: "Refined tasks awaiting user approval before implementation"
        user_action: "approve"

      # ── 06_ready ───────────────────────────────────────────────
      - name: "ready"
        purpose: "Approved tasks ready for autonomous implementation by the agent"
        artifacts: ["SUMMARY", "FAIL"]
        max_agents: 1
        ignore_if_exists: ["blocked", "review", "push"]
        ignore_if_dependency: ["ready", "blocked", "review", "push"]
        agent_behavior:
          - "Read WI-${SEQUENCE}-TASK.md to understand the original task and context"
          - "Read WI-${SEQUENCE}-REFINEMENT.md to understand the approved implementation plan and technical decisions"
          - "If WI-${SEQUENCE}-FAIL.md exists, read it to understand issues reported during review"
          - "Use WI-${SEQUENCE}-REFINEMENT.md as the primary source of truth for implementation"
          - "Implement the solution according to the approved refinement and project conventions"
          - "If review feedback exists in WI-${SEQUENCE}-FAIL.md, apply the required fixes"
          - "Write unit and/or integration tests covering the acceptance criteria"
          - "Run tests and ensure all checks pass"
          - "Run linting and formatting if applicable"
          - "Update documentation if the change affects public APIs or observable behavior"
          - "Create an implementation summary in WI-${SEQUENCE}-SUMMARY.md using the SUMMARY template"          
          - "Use the orqen_move_item tool (Orqen MCP Server) to move the item from ready to review"
          - "Finalize execution"
        critical_rules:
          - "FOLLOW the approved refinement — do not introduce unapproved architectural changes"
          - "WI-${SEQUENCE}-REFINEMENT.md is the authoritative implementation reference"
          - "ALL new code MUST include appropriate automated tests"
          - "NEVER leave the work item in a failing state"
          - "NEVER git commit"
          - "NEVER finalize code with failing tests, linting, or type checks"
        extra_prompt: |
          Autonomous implementation phase: the task refinement and technical direction
          have already been approved. Your responsibility is to execute the implementation
          faithfully and safely.

          If implementation constraints invalidate part of the approved refinement,
          document the divergence clearly in the SUMMARY and justify the decision.

          If implementation fails with a total blocker (cannot proceed), create the FAIL.md 
          artifact using the FAIL template and document the blocker in 
          detail - include what was attempted, what is needed, and suggested next steps. Then 
          use the orqen_move_item tool (Orqen MCP Server) to move the item from ready to blocked.

      # ── 07_blocked ─────────────────────────────────────────────
      - name: "blocked"
        purpose: "Tasks that cannot be completed due to blockers requiring user intervention"
        user_action: "resolve blockers"

      # ── 08_review ──────────────────────────────────────────────
      - name: "review"
        purpose: "Completed implementations awaiting quality review by the agent"
        artifacts: ["FAIL"]
        agent_behavior:
          - Read the provided task document and its SUMMARY artifact
          - Validate ALL acceptance criteria are met
          - Validate ALL DoD items are satisfied
          - Review code quality, security, and performance
          - If validation PASSES, approve the task - no artifact is created.
          - "Use the orqen_move_item tool (Orqen MCP Server) to move the item from review to push"
          - "Finalize execution"
        extra_prompt: |
          If validation FAILS, create the FAIL.md artifact using the FAIL 
          template. Document all rejection 
          reasons with specific evidence - include expected vs actual results 
          for each failure, severity, and recommended actions to fix.  Then 
          use the orqen_move_item tool (Orqen MCP Server) to move the item from review to ready

      # ── 09_push ──────────────────────────────────────────────
      - name: "push"
        purpose: "Commit and push the completed implementation to the repository"
        artifacts: ["FAIL"]
        agent_behavior:
          - Ensure the current branch is `main`
          - NEVER create branches or pull requests
          - Execute `git add .`
          - Read `.agents\skills\git-commit-message\SKILL.md`
          - Generate a commit message following the skill guidelines
          - Execute `git commit -m "<generated-message>"`
          - Execute `git push origin main`
          - If pre-commit or pre-push hooks fail, analyze the error carefully
          - "If the issue is NOT related to implementation logic (examples: formatting, lint, trivial merge issue, generated file update, metadata adjustment), fix the issue and retry"
          - Commit any non-implementation fixes using a new commit message generated from the same skill
          - Retry `git push origin main`
          - > 
            If the issue IS related to implementation defects, missing requirements, failing tests 
            caused by the implementation, broken behavior, architecture problems, or incomplete work, 
            DO NOT attempt implementation fixes, follow FAIL artifact description bellow          
          - If push succeeds, use the `orqen_move_item` tool (Orqen MCP Server) to move the item from `push` to `done`
          - Finalize execution
        extra_prompt: |
          If the push process FAILS and the issue cannot be resolved automatically,
          create the FAIL.md artifact using the FAIL template.

          Document:
          - the failed command
          - the complete error output
          - root cause analysis
          - attempted fixes
          - recommended corrective actions

          After creating FAIL.md, use the `orqen_move_item` tool
          (Orqen MCP Server) to move the item from `push` to `ready`
          for re-implementation or correction.

          Repository requirements:
          - Work ONLY on the `main` branch
          - Push directly to `main`
          - NEVER create branches
          - NEVER create pull requests
          - NEVER use `--no-verify`
          - Respect all pre-commit and pre-push hooks
          - If hooks fail, fix the underlying problem instead of bypassing validation


      # ── 10_done ────────────────────────────────────────────────
      - name: "done"
        purpose: "Archive of successfully completed tasks. Long-term storage of completed tasks"
        user_action: "archive, cleanup"
